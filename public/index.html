<script>
    let isCooldown = false;

    async function generateToken() {
        if (isCooldown) return;

        const inputField = document.getElementById('tokenInput');
        const btnGenerate = document.querySelector('.btn-generate');
        const urlValue = inputField.value.trim();

        if (!urlValue) {
            alert('Vui lòng nhập đường link!');
            return;
        }

        btnGenerate.disabled = true;
        inputField.value = "Đang xử lý...";

        try {
            const response = await fetch('/api/convert', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: urlValue })
            });

            const data = await response.json();

            if (data.success) {
                inputField.value = data.accessToken;
            } else {
                alert('Lỗi: ' + data.message);
                inputField.value = urlValue;
            }
        } catch (err) {
            alert('Có lỗi xảy ra khi kết nối máy chủ!');
            inputField.value = urlValue;
        }

        // Kích hoạt đếm ngược 10 giây trên giao diện
        startCooldown(10);
    }

    function startCooldown(seconds) {
        isCooldown = true;
        const btnGenerate = document.querySelector('.btn-generate');
        let remaining = seconds;

        btnGenerate.disabled = true;
        btnGenerate.style.opacity = '0.6';
        btnGenerate.style.cursor = 'not-allowed';

        const timer = setInterval(() => {
            btnGenerate.innerText = `CHỜ ${remaining}S...`;
            remaining--;

            if (remaining < 0) {
                clearInterval(timer);
                isCooldown = false;
                btnGenerate.disabled = false;
                btnGenerate.style.opacity = '1';
                btnGenerate.style.cursor = 'pointer';
                btnGenerate.innerHTML = 'GENERATE &rarr;';
            }
        }, 1000);
    }
</script>
