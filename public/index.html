<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ lấy token</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h1 {
            font-size: 20px;
            color: #38bdf8;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .btn-social {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: white;
            text-decoration: none;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn-social:hover {
            transform: translateY(-3px);
            opacity: 0.9;
        }
        .google { background-color: #ea4335; }
        .facebook { background-color: #1877f2; }
        .x-twitter { background-color: #000000; border: 1px solid #333; }
        .vk { background-color: #0077ff; }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        .btn-copy {
            padding: 0 15px;
            background-color: #334155;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
            font-weight: 500;
        }
        .btn-copy:hover {
            background-color: #475569;
        }
        .btn-generate {
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-generate:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Công cụ lấy token by @nghuydiy</h1>

        <!-- 4 nút liên kết mạng xã hội -->
        <div class="social-buttons">
            <a href="#" id="link-google" target="_blank" class="btn-social google" title="Google"><i class="fa-brands fa-google"></i></a>
            <a href="#" id="link-facebook" target="_blank" class="btn-social facebook" title="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" id="link-x" target="_blank" class="btn-social x-twitter" title="X"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="#" id="link-vk" target="_blank" class="btn-social vk" title="VKontakte"><i class="fa-brands fa-vk"></i></a>
        </div>

        <!-- Ô nhập link và nút Copy -->
        <div class="input-group">
            <input type="text" id="tokenInput" placeholder="Nhập đường link chứa eat token...">
            <button class="btn-copy" id="copyBtn" onclick="copyToken()">
                <i class="fa-regular fa-copy"></i> Copy
            </button>
        </div>

        <!-- Nút Tạo Token -->
        <button class="btn-generate" onclick="generateToken()">Generate Access Token</button>
    </div>

    <script>
        // Tải đường dẫn MXH từ server
        async function loadSocialLinks() {
            try {
                const res = await fetch('/api/social-links');
                const links = await res.json();
                
                if (links.google) document.getElementById('link-google').href = links.google;
                if (links.facebook) document.getElementById('link-facebook').href = links.facebook;
                if (links.x) document.getElementById('link-x').href = links.x;
                if (links.vk) document.getElementById('link-vk').href = links.vk;
            } catch (e) {
                console.error("Không thể tải link mạng xã hội:", e);
            }
        }
        loadSocialLinks();

        // Xử lý khi nhấn nút Generate
        async function generateToken() {
            const inputField = document.getElementById('tokenInput');
            const urlValue = inputField.value.trim();

            if (!urlValue) {
                alert('Vui lòng nhập đường link!');
                return;
            }

            inputField.value = "Đang xử lý...";

            try {
                const response = await fetch('/api/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlValue })
                });

                const data = await response.json();

                if (data.success) {
                    inputField.value = data.accessToken;
                } else {
                    alert('Lỗi: ' + data.message);
                    inputField.value = urlValue;
                }
            } catch (err) {
                alert('Có lỗi xảy ra khi kết nối máy chủ!');
                inputField.value = urlValue;
            }
        }

        // Xử lý Copy token
        function copyToken() {
            const inputField = document.getElementById('tokenInput');
            if (!inputField.value || inputField.value === "Đang xử lý...") {
                alert('Không có token để copy!');
                return;
            }
            
            inputField.select();
            navigator.clipboard.writeText(inputField.value);
            alert('Đã sao chép token vào bộ nhớ tạm!');
        }
    </script>
</body>
</html>
